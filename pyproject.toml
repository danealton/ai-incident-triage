[project]
name = "triage"
version = "0.1.0"
description = "AI Incident & Bug Triage — FastAPI backend"
readme = "README.md"
authors = [
    { name = "Daniil Tonkikh", email = "boleyelemeneye@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
triage = "triage:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
src = ["src"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
